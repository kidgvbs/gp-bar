[package]
name = "gp-bar"
version = "0.1.0"
description = "Menu bar client for the GlobalProtect VPN via the open-source gpclient CLI. No connection time limits."
authors = ["Gabriele Gallo"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Tray handles are created directly (not through tauri::tray), pinned to the
# exact 0.25.0 verified working on this machine. The early theories about
# menu-attach timing on macOS 27 beta were red herrings: the tray always
# worked, the app was frozen by a poller deadlock (see vpn::update). Keep the
# pin until 0.25.1 is explicitly re-verified; tauri's own requirement is
# "0.25", so cargo unifies both onto 0.25.0 and muda stays at 0.20.
tray-icon = { version = "=0.25.0", default-features = false, features = ["serde", "libappindicator"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
