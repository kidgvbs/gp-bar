[package]
name = "gp-bar"
version = "0.1.0"
description = "Menu bar client for the GlobalProtect VPN via the open-source gpclient CLI. No connection time limits."
authors = ["Gabriele Gallo"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
