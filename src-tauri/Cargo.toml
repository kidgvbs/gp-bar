[package]
name = "gp-bar"
version = "1.2.0"
description = "Menu bar client for the GlobalProtect VPN via the open-source gpclient CLI. No connection time limits."
authors = ["kidgvbs"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
dirs = "5"
# Only kill(pid, 0) for worker liveness (no subprocess probes), no other
# libc use. tauri already links libc transitively.
libc = "0.2"
# Typed command errors (vpn::AdminError and the wrapper enum around it):
# Display texts are the user-facing strings, Serialize carries the
# `{kind, detail}` wire shape to the frontend. Zero runtime dependencies
# beyond std (only the proc-macro crate thiserror-impl at build time).
thiserror = "2"
# Logging: tauri-plugin-log installs itself as the global `log` logger and
# owns the targets (stderr + the rotating ~/Library/Logs/gp-bar/panel.log),
# so call sites use the `log` facade macros. Version-unified with the
# plugin's own `log` dep.
log = "0.4"
tauri-plugin-log = "2"
# Native liquid-glass panel backdrop (macOS 26+), behind the webview.
window-vibrancy = "0.8.1"

# No gateway-list fetching pre-connect: the portal's getconfig wants the
# user's password (never handled here by design) and failed attempts risk
# session invalidation. Gateways come from connect logs and manual entry.

# Liquid glass: the panel's own WKWebView, handed to window-vibrancy via
# LiquidGlassOptions::content_view so the crate reparents it into the glass
# view (its fix for the focus-edge breakage, issue #198). Version unified
# with the one window-vibrancy 0.8.1 builds against (same maintainer tree).
# objc2-foundation supplies NSProcessInfo for the runtime OS-version check.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["objc2-app-kit", "WKWebView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSProcessInfo"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
